version: '3.8'

services:
  # Supabase (Postgres + pgvector)
  db:
    image: supabase/postgres:latest
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  # Application service (e.g., Flask app for RAG, Agent, Code Assistant)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      MODEL_NAME: ${MODEL_NAME}
      SUPABASE_URL: postgres://postgres:postgres@db:5432/postgres # Connect to the db service
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      CORPUS_URL: ${CORPUS_URL}
      #EXTERNAL_API_URL: ${EXTERNAL_API_URL}
      FLIGHTS_API_URL: ${FLIGHTS_API_URL}
      HOTELS_API_URL: ${HOTELS_API_URL}
      LLM_JUDGE_MODEL: ${LLM_JUDGE_MODEL}
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_MODEL_NAME: gemma3:4b
    volumes:
      - ./reports:/app/reports # Mount reports directory
    depends_on:
      - db

  # Ollama service for local LLM (optional, uncomment if needed )
  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   command: serve

  # Streamlit Dashboard
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      SUPABASE_URL: postgres://postgres:postgres@db:5432/postgres # Connect to the db service
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}    
    volumes:
      - ./reports:/app/reports # Mount reports directory
    depends_on:
      - db
      - app
      # - ollama # Uncomment if ollama service is enabled

volumes:
  db_data:
  # ollama_data: # Uncomment if ollama service is enabled
