[pytest]
# Pytest configuration for RAG pipeline tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 7.0

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:warnings

# Markers for test categorization
markers =
    unit: Unit tests (fast, use mocks, no external dependencies)
    integration: Integration tests (require real API access, slower)
    slow: Slow running tests
    skipif: Skip test based on condition

# Environment variables
env_files = .env

# Coverage options (if pytest-cov is installed)
# addopts = --cov=src --cov-report=html --cov-report=term

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (if pytest-timeout is installed)
# timeout = 300

# Asyncio mode
asyncio_mode = auto
